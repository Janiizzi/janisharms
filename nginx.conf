server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Redirects relativ ausgeben, damit nginx (Port 80 hinter TLS-Termination)
  # kein https->http Downgrade im Location-Header erzeugt
  absolute_redirect off;

  # Never cache index.html so deploys take effect immediately
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  # Hashed assets (JS/CSS) — cache for 1 year
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Static assets — cache for 1 week
  location ~* \.(?:png|jpg|jpeg|webp|gif|ico|svg|woff2|woff|ttf|pdf|lottie|wasm)$ {
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    # Prerenderte Seite direkt ausliefern (dist/projects/index.html etc.)
    # OHNE 301-Redirect auf den Trailing-Slash -> URL bleibt exakt wie in
    # Sitemap und Canonical (/projects statt /projects/).
    # Unbekannte URLs -> echtes 404 (kein Soft-404 durch SPA-Fallback).
    try_files $uri $uri/index.html $uri/ =404;
  }

  # Prerenderte 404-Seite mit echtem 404-Status ausliefern
  error_page 404 /404.html;
}